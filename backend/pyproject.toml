[project]
name = "apaar-platform-backend"
version = "0.1.0"
description = "SIH26263 prototype: APAAR-linked student data management and verification API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "B008",  # FastAPI dependency injection uses calls in defaults
    "S101",  # asserts are fine in tests
    "UP046", # pydantic generic models keep the Generic[T] form
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"tests/conftest.py" = ["E402", "I001"]
"app/seed.py" = ["S311"]
"alembic/versions/**" = ["E501"]
